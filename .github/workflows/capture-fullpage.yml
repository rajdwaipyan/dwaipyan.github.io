# Temporary: full-page captures for the portfolio browser previews. Removed once the images are committed.
name: Capture full-page previews
on:
  push:
    branches: ["claude/glass-services"]
    paths: ["tools/fullpage-sites.txt", "tools/fullpage.py", ".github/workflows/capture-fullpage.yml"]
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright==1.48.0 pillow && python -m playwright install --with-deps chromium
      - run: python tools/fullpage.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/full tools/fullpage-report.json
          git commit -m "Full-page previews captured by Actions" || echo "nothing to commit"
          git pull --rebase origin claude/glass-services || true
          git push
