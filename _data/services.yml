        tech: [n8n, OpenAI / Anthropic APIs, Google Sheets, Email]
        uses: [Sorting and summarising incoming enquiries, Drafting replies or reports for a person to review]
      - title: Workflow Automation
        text: Mapping a manual process, deciding which steps to automate, and building the workflow with error handling and notifications.
        tech: [n8n, Webhooks, Schedules, Error workflows]
        uses: [Moving data between forms, spreadsheets and a CRM, Scheduled reports and reminders]
