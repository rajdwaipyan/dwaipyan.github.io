        text: Connecting the tools you already pay for through their APIs, so data is entered once and appears where it is needed.
        tech: [REST APIs, Webhooks, OAuth, JSON]
        uses: [Website forms into a CRM, Orders or bookings into accounting or a spreadsheet]
