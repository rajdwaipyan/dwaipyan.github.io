    tools: [ChatGPT, Claude, Gemini, n8n, REST APIs, Webhooks, Google Workspace, Claude Code, Cursor]
    price: "Prompt engineering packages start at $49; automation projects are quoted after a short brief."
    services:
      - title: AI Prompt Engineering
        text: Custom prompts, prompt libraries and instruction systems for ChatGPT, Claude, Gemini and AI coding tools — with a free prompt library to try first.
        tech: [ChatGPT, Claude, Gemini, Claude Code, Cursor]
        uses: [Consistent outputs for a repeated business task, A shared prompt library for a team, Project rules for AI coding assistants]
        link: { label: "Prompt engineering, free library and packages", url: ai-prompt-engineering/ }
      - title: AI Agent Development
        text: "Agents that carry out multi-step tasks with clear limits: a defined role, the tools they may use, when to ask a person, and checks before they act."
        tech: [Claude, ChatGPT, Tool / function calling, n8n AI nodes]
        uses: [A research or reporting assistant that works from your own documents, A support assistant that answers from your policies and hands over to a person]
