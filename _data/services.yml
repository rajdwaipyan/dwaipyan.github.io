  - id: cybersecurity
    n: "04"
    title: Cybersecurity & IT Solutions
    short: Security & IT
    line: Securing websites and the infrastructure behind them, and practical advice on what to fix first.
    intro: "My master's research looked at cyber resilience in Bangladesh's ISP sector, and security is part of every site I build. For businesses, that means hardened websites, a clear picture of their risks and IT set up so it is easier to keep safe."
    tools: [WordPress hardening, Web application firewalls, SSL / TLS, Backups, Access control, Network fundamentals]
    price: Quoted per project after a short brief.
    services:
      - title: Website Security
        text: Hardening a website and its hosting — HTTPS everywhere, secure headers, least-privilege accounts, backups you have tested and monitoring.
        tech: [SSL / TLS, Security headers, Backups, Uptime monitoring]
        uses: [A business site that has never had a security review, Preparing a site before a launch or campaign]
      - title: WordPress Security
        text: WordPress-specific protection — updates, plugin review, login protection, a firewall, file permissions and clean-up after an incident.
        tech: [Wordfence / firewall plugins, 2FA, Plugin audit, Malware clean-up]
        uses: [A hacked or spam-injected WordPress site, Reducing risk from old or unused plugins]
