# SERVICES — /services/ and one page per category (services/<id>/index.html sets `service: <id>`).
# Describe what you do and how, not results you can't show. No client names, numbers or guarantees here:
# proof comes from `related` — case studies in _data/projects.yml (ids), and `sites` — website categories
# from _data/sites.yml shown as live previews.
#
# Fields per category
#   id, n, title, short (nav label), line (one sentence), intro (a paragraph), tools (technology list)
#   services: title, text, tech (list), uses (list of typical situations)
#   related: project ids · sites: site category ids · links: extra related pages { label, url, text }
#   price: how it is priced (shown on the page)

categories:
  - id: web-development
    n: "01"
    title: Web Design & Development
    short: Websites
    line: WordPress, WooCommerce and custom websites — designed, built and handed over ready to run.
    intro: "Most of my client work is here: business websites, online stores and booking sites, built mainly on WordPress with Elementor Pro and WooCommerce, and on Webflow, Wix or custom code when the project calls for it. Every site is responsive, fast to load and handed over so the client can edit it."
    tools: [WordPress, Elementor Pro, Crocoblock, WooCommerce, PHP, JavaScript, HTML & CSS, Webflow, Wix, Shopify]
    price: Quoted per project after a short brief.
    services:
      - title: WordPress Development
        text: Business websites on WordPress, from structure and design to forms, SEO basics, speed and hand-over training.
        tech: [WordPress, Elementor Pro, Yoast / Rank Math]
        uses: [A company website that the team can update itself, Moving an outdated site to a maintainable WordPress build, Landing pages for a campaign or a new service]
      - title: Full-Stack WordPress Development
        text: "When a theme or plugin isn't enough: custom post types, custom fields, custom plugins and integrations with outside systems."
        tech: [PHP, MySQL, WordPress REST API, JavaScript, Crocoblock JetEngine]
        uses: [Internal tools built as WordPress plugins, Directories and listings with custom fields and filters, Connecting forms and data to a CRM or another API]
      - title: Elementor Pro
        text: Pixel-careful Elementor Pro builds with global styles, reusable templates and dynamic content — so the site stays consistent as it grows.
        tech: [Elementor Pro, Crocoblock, Global styles and templates]
        uses: [Turning a Figma or image design into a live Elementor site, Cleaning up an Elementor site that has become slow or inconsistent]
      - title: WooCommerce Development
        text: Online stores and booking flows with WooCommerce — products, variations, payments, shipping and the emails customers receive.
        tech: [WooCommerce, Payment gateways, Booking extensions]
        uses: [A product catalogue with online ordering, Bookable experiences or services paid online, Adding a shop to an existing WordPress site]
      - title: Website Redesign & Optimisation
        text: Redesigning a live site without losing its content or search visibility, and fixing what makes it slow, dated or hard to use.
        tech: [Core Web Vitals, Image optimisation, Caching, Redirect mapping]
        uses: [A site that looks dated or doesn't work well on phones, A slow site with poor PageSpeed results, Restructuring pages so visitors find services faster]
      - title: Custom Website Development
        text: Hand-built sites in HTML, CSS and JavaScript when a page builder would get in the way — fast, accessible and easy to host.
        tech: [HTML, CSS, JavaScript, Jekyll, GitHub Pages]
        uses: [A lightweight portfolio or company site, An interactive page such as a calculator or product explorer]
      - title: Webflow & Wix Development
        text: Building and updating sites on Webflow and Wix for clients who already use those platforms or prefer a hosted builder.
        tech: [Webflow, Wix]
        uses: [Extending or redesigning an existing Webflow or Wix site, A simple hosted site the owner can manage without plugins]
    related: [eagle, arca, vtek, els, osea]
    sites: [property, architecture, automotive, trades, food, brands, health]

  - id: ai-automation
