        tech: [WordPress, GoHighLevel, n8n, AI APIs]
        uses: [A lead-to-customer pipeline from first enquiry to follow-up, An internal dashboard fed by several tools]
      - title: AI-Assisted Productivity Solutions
        text: Setting up AI assistants, Projects, Gems and custom GPTs for a team, with usage guidelines and prompts for their daily tasks.
        tech: [ChatGPT Projects / GPTs, Claude Projects, Gemini Gems]
        uses: [A team adopting AI with shared rules, Writing, research and meeting-notes assistants]
