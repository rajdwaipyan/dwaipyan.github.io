    flickr: "https://www.flickr.com/photos/199494905@N04/sets/72177720322368544/"
    description: "This shot captures the majestic Kedarnath Mountain, a towering peak in the Garhwal Himalayas of Uttarakhand. Rising to 6,940 meters, its snow-clad beauty and rugged charm make it a dream for mountain view photography enthusiasts. Framed by serene valleys and dramatic skylines, this scene embodies the raw grandeur of the Himalayas—perfectly timed to showcase the golden glow of sunrise over the peaks. A true masterpiece of nature for anyone who loves capturing the soul of the mountains."
