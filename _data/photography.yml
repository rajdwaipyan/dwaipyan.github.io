# ADD A PHOTO to an album: save <id>-1024.webp and <id>-560.webp in assets/img/photos/ and add
#   - { id: "12345", title: "Title", w: 1024, h: 683, page: "https://www.flickr.com/photos/…/12345/" }
#   (w/h = the size of the -1024 image; `page` is optional — the photo's page on Flickr or elsewhere).
# ADD AN ALBUM: copy an album block below. `cover` is the id of one of its photos; `categories` use the ids below.
# A photo that is in two albums is listed in both, and shown once in the gallery.

