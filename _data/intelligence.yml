  - { id: freelance, from: Freelance web developer, short: "Freelance web developer", level: live, page: "experience/#independent" }
  # Confirmed by Dwaipyan, not (yet) documented on the site — shown as "stated", with no dates.
  - id: tech-maximus
    label: Web Developer — Tech Maximus
    short: "Web developer — Tech Maximus"
    level: stated
    summary: Worked as a web developer at Tech Maximus. Dates to be confirmed, so it is not on the Experience page yet.
  - id: pentangular
