# DWAIPYAN INTELLIGENCE — the connections between capabilities and the evidence for them.
#
# Facts are NOT repeated here: projects, roles, degrees, training, research and programmes are read at build time
# from projects.yml, experience.yml, education.yml and leadership.yml, and technologies from each project's
# `built_with` and from skills.yml. This file only says how things connect, so the map stays true when those
# files change. Every link must be backed by something a visitor can open.
#
# Evidence levels (shown on every item, strongest first):
#   live      a live client website you can open
#   record    an academic or organisational record (degree, accepted report, appointment)
#   role      a role described on this site (Experience, Leadership)
#   self      a capability Dwaipyan describes himself; ask for examples
#   stated    stated by Dwaipyan, not yet documented on this site
#   goal      a direction or something in progress — not an accomplishment
#
# Node ids: cap:<id> capability · proj:<id> project (projects.yml) · role:<id> · edu:<id> (education.yml degree id)
#           report · train:<n> (1-based, education.yml training) · research:<n> · prog:<id> (leadership.yml)
#           tech:<slug> (lower-case, every run of other characters → '-', e.g. "C# / ASP.NET MVC" → c-asp-net-mvc)
#           goal:<id> · bscp:<n> (BSc projects)

capabilities:
  - id: wordpress
    label: WordPress websites
    level: live
    summary: Business websites built on WordPress and Elementor — the core of the freelance and agency work.
    skills_group: Websites & e-commerce
    tech: [wordpress, elementor-pro, elementor, crocoblock, custom-themes, speed-responsive-optimisation]
    projects: [eagle, arca, vtek, els, osea]
    roles: [ed-shield, freelance, tech-maximus]
    pages: [{ label: Web development service, url: services/web-development/ }, { label: Portfolio, url: portfolio/ }]

  - id: ecommerce
    label: Online stores & booking
    level: live
    summary: Stores and bookable products on WooCommerce and Shopify.
    tech: [woocommerce, shopify]
    projects: [osea]
    roles: [ed-shield, freelance]
    pages: [{ label: O-Sea Bora Bora case study, url: portfolio/osea/ }]

  - id: crm
    label: CRM & workflow automation
    level: live
    summary: Lead capture wired into a CRM pipeline with automatic routing and follow-up — GoHighLevel, n8n, webhooks.
    skills_group: CRM & automation
    tech: [gohighlevel, n8n, a2p-10dlc-sms, workflow-automation, webhooks, rest-apis]
    projects: [eagle]
    roles: [ed-shield, freelance]
    pages: [{ label: CRM automation service, url: services/crm-automation/ }, { label: Eagle Premier case study, url: portfolio/eagle/ }]

  - id: webapps
    label: Web apps, plugins & integrations
    level: self
    summary: Custom WordPress plugins, dashboards and integrations between systems. The company's own attendance and expense tools are internal and not public.
    skills_group: Web applications & integration
    tech: [custom-wordpress-plugins, dashboards-client-portals, rest-apis, webhooks, databases, php]
    projects: [edshield-tools]
    roles: [ed-shield]
    pages: [{ label: Portfolio — how it is built, url: "portfolio/#build" }]

  - id: ai
    label: AI automation & prompt engineering
    level: self
    summary: AI-assisted workflows and prompt systems offered as a service; ask for examples of delivered work.
    tech: [ai-assisted-workflows, n8n]
    roles: [ed-shield]
    pages: [{ label: AI prompt engineering, url: ai-prompt-engineering/ }, { label: AI automation service, url: services/ai-automation/ }]

  - id: security
    label: Cybersecurity & research
    level: record
    summary: A master's project report on cyber resilience in Bangladesh's ISP ecosystem, security training, and ongoing research into home-network security.
    skills_group: Security & research
    tech: [wordpress-hardening, network-wi-fi-security-studying, research-design, technical-writing]
    education: [report, pmit, train:1, train:2]
    research: [1, 2, 3]
    pages: [{ label: Cybersecurity service, url: services/cybersecurity/ }, { label: Research, url: "education/#research" }]

  - id: it-leadership
    label: IT & project management
    level: role
    summary: From January 2020 to October 2026, ran an NGO's IT and managed development-sector projects, including programme work with the ILO and Dhaka South City Corporation.
    tech: [it-management, project-management, programme-coordination, stakeholder-reporting]
    roles: [sms-it]
    programmes: [ilo-dscc]
    pages: [{ label: Leadership, url: leadership/ }]

  - id: leadership
    label: Organisational leadership
    level: record
    summary: Chief Executive Officer of Surjamukhi Sangstha since 26 October 2026; co-founder and operational CEO of ED Shield Solutions.
    skills_group: Leadership & management
    tech: [organisational-leadership]
    roles: [sms-ceo, ed-shield, pentangular]
    pages: [{ label: Leadership, url: leadership/ }, { label: Experience, url: experience/ }]

  - id: academic
    label: Education & academic work
    level: record
    summary: B.Sc. in Computer Science & Engineering and a Professional Masters in Information Technology, with project work in machine learning and software.
    education: [pmit, bsc, report, bscp:1, bscp:2, bscp:3, train:3, train:4]
    goals: [grad-study]
    pages: [{ label: Education, url: education/ }, { label: CV, url: cv/ }]

  - id: programming
    label: Programming
    level: self
    summary: The languages behind the work — PHP and JavaScript day to day, Python and C#/.NET from study and earlier projects.
    skills_group: Programming
    tech: [php, javascript, html-css, python, c-asp-net-mvc]
    education: [bscp:1, bscp:2, bscp:3, train:3]

