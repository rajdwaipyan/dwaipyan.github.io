# Selected work — one entry per project, in the order they appear on the page.
#
# Edit this file on GitHub (pencil icon) and the site rebuilds itself.
# Only write what you can show: facts below were checked against each live site
# (platform from the page source) or stated by Dwaipyan.
#
# Fields
#   id          short slug, used for the anchor (#work-<id>) and image names
#   title       project name
#   category    one line shown above the title
#   url         live site (leave empty if not public)
#   room        background of the project's full-width "room": ink | navy | paper | violet | lime
#   layout      how it is presented: split | system | scroll | stack | poster
#   summary     one sentence, what the client does
#   brief       what the site had to do
#   role        what YOU did — leave empty until confirmed; it is hidden when empty
#   built_with  list of tools, from the page source or your own records
#   outcome     only verified, documented results; leave empty otherwise
#   images      files in assets/img/work/ (desktop 1582×989, mobile 520×1125)
#   facts       optional extra lines for the "system" layout
#   guide       optional: what the cartoon guide says when this project scrolls into view
#   guide_prop  optional costume: glasses | shades | hardhat | headset | tie | bowtie | lei (space-separated)
#   guide_side  left or right: where the guide stands (on wide screens) — opposite the screenshot
#   scratch     true = a sand "scratch to reveal" card over the main screenshot

- id: eagle
  title: Eagle Premier Real Estate
  category: Website + CRM automation · North Carolina, US
  url: https://epreality.com/
  room: navy
  layout: system
  guide: "Five lead forms, one GoHighLevel pipeline, follow-up by text. This is my favourite kind of plumbing."
  guide_prop: headset
  guide_side: left
  summary: A local home-buying company that makes fair cash offers to North Carolina homeowners.
  brief: Turn visitors into qualified leads, keep each type of enquiry organised in the CRM, and follow up without anyone copying data by hand.
  role: Built the WordPress site and its five lead forms, and set up the GoHighLevel pipeline, workflows and SMS behind them.
  built_with: [WordPress, Elementor Pro, GoHighLevel, A2P 10DLC SMS]
  outcome:
  images:
    desktop: eagle-desktop.webp
    detail: eagle-form.webp
  facts:
    - label: Lead forms
      value: Five forms — seller, cash buyer, private lender, commercial and contact — feeding GoHighLevel
    - label: Follow-up
      value: GoHighLevel pipeline and workflow automation, A2P 10DLC SMS registration and a dedicated local number
    - label: On-site chat
      value: GoHighLevel chat widget, with compliance fixes

