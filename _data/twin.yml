  - id: security
    t: Cybersecurity
    q: [cybersecurity, cyber security, security, security projects, cybersecurity projects, hacking, penetration, pentest, network security, wifi, wi-fi, router, isp, zero trust, infosec, wordpress security, hardening, cyber resilience, digital shield, hack, hacked site, malware, secure my site, clean up]
    a: "His cybersecurity work is research and practice rather than a list of products. His master's project report, Digital Shield, studied cyber resilience across Bangladesh's internet service providers and proposed a security and policy roadmap. He has completed professional cyber security and Cisco CyberOps training, and his security services cover WordPress hardening and clean-up after an incident."
    more: "His research interests are ISP and home-network security in Bangladesh, cyber-resilience policy, and responsible disclosure."
    links: [{ label: Research, url: "education/#research" }, { label: Security services, url: "services/cybersecurity/" }]

  - id: netguard
    t: NetGuard Bangladesh
    q: [netguard, net guard, netguard bangladesh]
