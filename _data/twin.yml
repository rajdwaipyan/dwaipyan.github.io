topics:
  - id: who
    t: Who is Dwaipyan Mandal
    q: [who is dwaipyan, who is he, who are you talking about, introduce, introduction, about him, tell me about dwaipyan, about dwaipyan mandal, summary, overview, bio, dwaipayan]
    a: "Dwaipyan Mandal is a technology leader and web developer based in Dhaka, Bangladesh. He is Chief Executive Officer of Surjamukhi Sangstha, a non-governmental organisation, co-founder of the web company ED Shield Solutions, and has built websites and automations for international clients since 2020."
    more: "He holds a BSc in Computer Science and Engineering and a Professional Masters in Information Technology, and his research interest is cyber resilience in Bangladesh's internet service providers."
    links: [{ label: About him, url: "about/" }, { label: View CV, url: "cv/" }]

  - id: does
    t: What he does
    q: [what does he do, what do you do, his job, his work, profession, occupation, what is his role, current role, what is he working on, day to day]
    a: "Three things. He leads Surjamukhi Sangstha as its Chief Executive Officer. He runs operations at ED Shield Solutions, the web company he co-founded. And he builds websites, online stores, CRM systems and AI automations for clients abroad."
    links: [{ label: Services, url: "services/" }, { label: Experience, url: "experience/" }]

  - id: experience
    t: Professional experience
    q: [professional experience, experience, career, work history, background, employment, where has he worked, how many years, years of experience, track record]
    a: "He joined Surjamukhi Sangstha in January 2020 to lead its IT and manage projects, and was appointed its Chief Executive Officer in October 2026. Alongside that, he co-founded ED Shield Solutions and has freelanced since April 2020 — more than six years of websites, stores and automations for clients outside Bangladesh."
    more: "His client sites are live in the United States, French Polynesia and for a consultancy working between Europe and Asia-Pacific."
    links: [{ label: Experience, url: "experience/" }, { label: View CV, url: "cv/" }]

  - id: ceo
    t: His role as CEO
    q: [ceo, chief executive, role as ceo, his role at surjamukhi, leadership role, what does he do as ceo, executive, leads, leader, leadership]
    a: "He was appointed Chief Executive Officer of Surjamukhi Sangstha with effect from 26 October 2026, after nearly seven years running the organisation's IT and managing its projects. The specific initiatives and results of the role will be published on the Leadership page as they are confirmed."
    links: [{ label: Leadership, url: "leadership/" }]

  - id: surjamukhi
    t: Surjamukhi Sangstha
    q: [surjamukhi sangstha, surjamukhi, sangstha, sms, ngo, non-governmental, nonprofit, non profit, organisation he leads, organization he leads, development organisation]
    a: "Surjamukhi Sangstha, or SMS, is a non-governmental organisation in Bangladesh. Dwaipyan joined it in January 2020 to run its technology and manage projects, and has been its Chief Executive Officer since October 2026."
    more: "His project work there included programme activities involving the International Labour Organization and Dhaka South City Corporation."
    links: [{ label: Leadership, url: "leadership/" }]

  - id: international
    t: Work with international organisations
    q: [international organisations, international organizations, ilo, international labour organization, united nations, un, dhaka south city corporation, dscc, government projects, development sector, donors, partners, ngo projects, international clients, clients abroad, overseas, global clients, which countries, programme, programmes he worked on]
    a: "Yes, in two ways. At Surjamukhi Sangstha he managed projects that included programme activities involving the International Labour Organization and Dhaka South City Corporation — his part was IT and project management. As a developer, his clients are international: the United States, French Polynesia, and a consultancy with offices in Germany, Singapore, Hong Kong and China."
    links: [{ label: Leadership, url: "leadership/" }, { label: Projects, url: "portfolio/#projects" }]

  - id: edshield
    t: ED Shield Solutions
    q: [ed shield, edshield, ed shield solutions, his company, company, agency, co-founder, cofounder, founder, business, white label, white-label, startup]
    a: "ED Shield Solutions is a web design and development company in Dhaka that Dwaipyan co-founded. He runs its day-to-day operations. It builds WordPress websites and online stores, does white-label development for digital agencies, and sets up CRM and workflow automation."
    more: "The company also uses its own in-house WordPress tools for attendance and expense tracking."
    links: [{ label: Experience, url: "experience/" }]

  - id: freelance
    t: Freelance work
    q: [freelance, freelancer, freelancing, fiverr, upwork, independent, self employed, contractor, remote work, how long has he freelanced]
    a: "He has freelanced since April 2020, building business websites on WordPress and Elementor Pro, online stores on WooCommerce and Shopify, and GoHighLevel, n8n and API integrations — mostly for clients outside Bangladesh, through Fiverr and directly."
    links: [{ label: Portfolio, url: "portfolio/" }, { label: Fiverr profile, url: "https://www.fiverr.com/dwaipyan" }]

  - id: skills
    t: Technical skills
    q: [technical skills, skills, skill set, expertise, tech stack, stack, technologies, tools, what can he do, programming languages, languages does he code, capabilities, competencies, what does he build with, python, php, javascript, html, css, c#, asp.net, coding, programming, code]
    a: "His core stack is WordPress, Elementor Pro, Crocoblock and WooCommerce for websites and stores; custom WordPress plugins, REST APIs and webhooks for integration; and GoHighLevel and n8n for CRM and automation. He codes in PHP, JavaScript, HTML and CSS, Python, and C# with ASP.NET MVC."
    more: "On the management side: organisational leadership, project and IT management, and stakeholder reporting. In security: WordPress hardening, and he is studying network and Wi-Fi security."
    links: [{ label: Services, url: "services/" }, { label: View CV, url: "cv/" }]

  - id: wordpress
    t: WordPress and web development
    q: [wordpress, web development, website development, websites, elementor, elementor pro, crocoblock, woocommerce, shopify, online store, ecommerce, e-commerce, web developer, web design, plugin, plugins, custom plugin, landing page, redesign, speed, webflow, wix]
    a: "WordPress is his main platform. He builds business websites with Elementor Pro and Crocoblock, online stores with WooCommerce, and custom plugins when a theme isn't enough. The portfolio shows the sites he has built, each in a scrolling preview."
    more: "He also builds on Shopify, and in hand-written HTML, CSS and JavaScript — this website is an example of that."
    links: [{ label: See the websites, url: "portfolio/#websites" }, { label: Web development services, url: "services/web-development/" }]

  - id: crm
    t: GoHighLevel and CRM automation
