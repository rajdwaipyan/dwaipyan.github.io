    links: [{ label: Research, url: "education/#research" }, { label: Contact, url: "#contact" }]

  - id: education
    t: Education
    q: [education, educational background, degree, degrees, university, college, studied, study, qualification, qualifications, masters, master's, bachelor, bsc, pmit, jahangirnagar, stamford, cgpa, graduated, academic background]
    a: "He holds a Professional Masters in Information Technology from the Institute of Information Technology at Jahangirnagar University — his project report was accepted in April 2025 — and a BSc in Computer Science and Engineering from Stamford University Bangladesh, where he graduated in 2022."
    more: "His results were a CGPA of 3.02 out of 4 for the masters and 3.34 out of 4 for the BSc."
    links: [{ label: Education, url: "education/" }]

  - id: research
    t: Research and academic projects
    q: [research, academic projects, academic project, thesis, project report, master's project, masters project, dissertation, paper, papers, publication, publications, published, university projects, final year project, drowsiness, research interests]
    a: "His master's project report is titled Digital Shield: Bangladesh's Transformative Roadmap to Cyber Resilience in the ISP Ecosystem, supervised by Professor Dr. Fahima Tabassum and accepted on 5 April 2025. During his BSc he built a driver drowsiness detector using a convolutional neural network, and two management systems in ASP.NET MVC."
    more: "The report isn't publicly available, and he has no peer-reviewed publications yet. He also writes about technology and cybersecurity on Medium."
