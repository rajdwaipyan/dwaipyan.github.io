    a: "Yes. He sets up GoHighLevel — pipelines, forms, calendars, workflows, SMS and email — and connects it to the website. For Eagle Premier Real Estate he built five lead forms feeding one GoHighLevel pipeline, with workflows and registered A2P 10DLC text messaging behind them."
    links: [{ label: Eagle Premier case study, url: "portfolio/eagle/" }, { label: CRM services, url: "services/crm-automation/" }]

