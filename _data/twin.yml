# THE DIGITAL TWIN — what the drawn Dwaipyan knows and says (assets/js/twin*.js, _includes/guide.html).
#
# Everything the assistant can say about you comes from this file plus the project, service, experience and
# education data files (see assets/twin-knowledge.json, which Jekyll builds from them). It never invents facts:
# when nothing here matches a question, it says so and points to the contact options.
#
# Edit an answer: change the `a:` text. Add a topic: copy a block, give it a new id, list the words and
# phrases a visitor might use in `q:` (lower case), and write the answer in the third person ("He …").
# Keep answers short — they are also read aloud. `more:` is used when a visitor asks for more detail.
# `links:` become buttons under the answer. Urls are relative to the site root, or full https/mailto links.

name: Dwaipyan Mandal — Personal AI Assistant
short: Dwaipyan's digital twin

# Live AI (optional). Leave empty to answer from this file in the visitor's browser — no server, no cost.
# To connect a real language model, deploy tools/twin-worker (see its README) and paste the Worker URL here.
# Never put an API key in this file or anywhere in the website's code.
endpoint: ""

greeting: "Hi — I'm Dwaipyan's digital twin. Ask me anything about him."
intro: "I'm a drawn, digital version of Dwaipyan. Ask me about his work, experience, education or services — by typing or by voice — and I can take you to the right page."
unknown: "I don't have that in my notes, and I'd rather not guess. You can ask Dwaipyan directly — he replies by email or WhatsApp."

# Questions offered as buttons. `default` is used when nothing more specific fits the page or section.
suggestions:
  default: ["Who is Dwaipyan Mandal?", "What does he do?", "How can I hire him?", "Show me his projects"]

# Context: the first entry whose `section` (an element id in view) or `page` (the page's nav key, or part of
# its address) matches decides the hint and the suggested questions. Sections are checked before pages.
contexts:
  - section: [work, more-websites, websites, projects, proj-grid]
    hint: Ask me about these projects
    ask: ["What kinds of websites has he built?", "Tell me about Eagle Premier Real Estate", "Does he work with GoHighLevel?"]
  - section: [expertise]
    hint: Ask me about his skills
    ask: ["What are his technical skills?", "What is his WordPress experience?", "Does he do CRM automation?"]
  - section: [leadership-snapshot]
    hint: Ask me about his role as CEO
    ask: ["What is Surjamukhi Sangstha?", "What is his role as CEO?", "Does he work with international organisations?"]
  - section: [academic-snapshot, research, report]
    hint: Ask me about his studies
    ask: ["Tell me about his education", "What was his master's project about?", "What are his research interests?"]
  - section: [contact, connect, start]
    hint: I can help you reach him
    ask: ["How can I contact him?", "How can I hire him?", "How can I collaborate with him?"]
  - section: [builder]
    hint: Describe your business to me
    ask: ["I want to start an eCommerce business", "I own a restaurant and need more customers", "My business needs a CRM and automation system"]
  - section: [lifecycle, solutions, industries, technology, inquiry]
    hint: Ask me what fits your business
    ask: ["What business solutions does he offer?", "I want to expand my business internationally", "How can I start a project?"]
  - section: [library, try, setup, pricing]
    hint: Ask me about prompt engineering
    ask: ["What is his prompt engineering service?", "How much do the packages cost?", "How can I hire him?"]
  - page: [portfolio/eagle, portfolio/arca, portfolio/vtek, portfolio/els, portfolio/osea]
    hint: Want this project explained?
    ask: ["Explain this project", "What was built with?", "Show me his other projects"]
  - page: [portfolio]
    hint: Ask me about his work
    ask: ["What kinds of websites has he built?", "Tell me about Eagle Premier Real Estate", "What does he build with?"]
  - page: [solutions]
    hint: Tell me about your business
    ask: ["I want to start an eCommerce business", "What business solutions does he offer?", "How can I start a project?"]
  - page: [services]
    hint: Ask me what he offers
    ask: ["What services does he offer?", "Does he build AI automations?", "How is a project priced?"]
  - page: [experience]
    hint: Ask me about his experience
    ask: ["Tell me about his professional experience", "What is ED Shield Solutions?", "How long has he freelanced?"]
  - page: [leadership]
    hint: Ask me about his leadership
    ask: ["What is his role as CEO?", "What is Surjamukhi Sangstha?", "Which programmes has he worked on?"]
  - page: [education]
    hint: Ask me about his studies
    ask: ["Tell me about his education", "What was his master's project about?", "What training has he completed?"]
  - page: [ai-prompt-engineering]
    hint: Ask me about prompt engineering
    ask: ["What is his prompt engineering service?", "How much do the packages cost?", "Are the prompts free?"]
  - page: [photography]
    hint: Ask me about the photos
    ask: ["Tell me about his photography", "Who is Dwaipyan Mandal?", "How can I contact him?"]
  - page: [journal, watch]
    hint: Ask me about his writing
    ask: ["What does he write about?", "What are his research interests?", "Who is Dwaipyan Mandal?"]
  - page: [about]
    hint: Ask me about him
    ask: ["Who is Dwaipyan Mandal?", "What languages does he speak?", "What is he planning next?"]

