# How work is engaged.
engagements:
  - { id: consult, title: Consultation, text: "A paid session or short written review to answer one question well — a plan, an audit or a second opinion." }
  - { id: project, title: Project, text: "A defined scope with deliverables, timeline and price agreed in writing before work starts." }
  - { id: retainer, title: Retainer, text: "A monthly arrangement for ongoing marketing, optimisation, automation or support." }
  - { id: transform, title: Transformation programme, text: "A phased programme across several areas — for example website, CRM, automation and security — planned together and delivered in stages." }

