# 360° BUSINESS SOLUTIONS — /solutions/ (solutions/index.html, assets/js/solutions.js, assets/js/builder.js).
#
# HONESTY RULES FOR THIS FILE
#   delivery: direct   = Dwaipyan / ED Shield Solutions deliver it themselves (only set this when true)
#   delivery: scoped   = shown as "scoped per project — in-house or with specialist partners"
#   budget: ""         = shown as "quoted after a short call". Put a real starting range here, e.g. "from $1,500",
#                        and the page and the Business Builder will use it. Nothing else invents a price.
#   proof:             = only real case studies or pages on this site.
# The four categories already on /services/ are marked direct because that page says so; mark the others yourself.

brand: ED Shield Solutions
lead: Dwaipyan Mandal

# The optional backend (tools/hostinger-api) — its public address, e.g. "https://api.example.com/".
# Empty = everything runs in the visitor's browser: blueprints are drafted by rules, and enquiries are sent
# from the visitor's email app or WhatsApp. Never put an API key here.
api: ""   # leave empty — the API address now lives in _data/forms.yml (endpoint)

categories:
  - id: strategy
    n: "01"
    title: Business Strategy & Startup Consulting
    short: Strategy
    problem: "An idea, a budget and too many possible first steps — with no clear order, scope or way to tell what matters first."
    approach: "Turn the idea into a written plan: who the customer is, what is sold and how, what has to exist on day one, and what can wait. Every recommendation is tied to a cost and a sequence."
    deliverables: [Business and customer brief, Offer and pricing structure options, Launch scope (must-have vs later), Phased roadmap with dependencies, Technology and vendor choices]
    value: Fewer expensive false starts, and a plan that everyone involved can follow.
    tech: [Notion / Google Workspace, Miro, Spreadsheet models]
    delivery: scoped
    budget: ""
    service_page: ""
  - id: branding
    n: "02"
    title: Branding & Creative Identity
    short: Branding
    problem: "A business that looks improvised — inconsistent logo use, colours and tone — loses trust before anyone reads a word."
    approach: "Define how the business should come across, then turn it into a small, usable identity system applied to the website, documents and social profiles."
    deliverables: [Name and positioning workshop, Logo and identity system, Colour and type palette, Brand guidelines, Templates for social and documents]
    value: A business that looks established from the first impression, and stays consistent as more people create for it.
    tech: [Figma, Adobe Illustrator, Canva brand kits]
    delivery: scoped
    budget: ""
    service_page: ""
  - id: web
    n: "03"
    title: Website, eCommerce & Application Development
    short: Websites & apps
    problem: "A website that is slow, dated or hard to update — or no online way to sell, book or capture leads at all."
    approach: "Design and build the site, store or web application on the platform that fits the business, connected to forms, payments and the CRM, and handed over so the team can run it."
    deliverables: [Information architecture and page plan, Website or online store build, "Payments, booking and forms", Integrations with CRM and email, Hand-over training and documentation]
    value: A site that earns trust, captures enquiries and sales, and can be updated without a developer for every change.
    tech: [WordPress, Elementor Pro, Crocoblock, WooCommerce, Shopify, Webflow, Wix, HTML / CSS / JavaScript]
    delivery: direct
    budget: ""
    service_page: services/web-development/
  - id: marketing
    n: "04"
    title: Digital Marketing & Customer Acquisition
    short: Marketing
    problem: "Good products that not enough of the right people hear about — or ad spend with no way to tell what is working."
    approach: "Pick the few channels that fit the customer, set up campaigns with measurement from day one, and connect every lead to the CRM so it is followed up."
    deliverables: [Channel and audience plan, "Campaign set-up (search, social, email)", Landing pages and lead magnets, Tracking and conversion events, Monthly performance review]
    value: Customer acquisition you can measure and adjust, instead of guessing.
    tech: [Google Ads, Meta Ads, Email marketing, Google Analytics 4, Tag Manager]
    delivery: scoped
    budget: ""
    service_page: ""
  - id: seo
    n: "05"
    title: SEO & Search Visibility
    short: SEO
    problem: "Customers search for exactly what the business offers — and find competitors instead."
    approach: "Fix the technical basics, structure pages around what customers actually search for, and set up local and structured-data signals so search engines understand the business."
    deliverables: [Technical SEO audit and fixes, Keyword and page mapping, On-page optimisation, Google Business Profile and local SEO, Structured data, Content plan]
    value: A steady source of visitors who are already looking for what you sell.
    tech: [Google Search Console, Rank Math / Yoast, Schema.org, PageSpeed / Core Web Vitals]
    delivery: scoped
    budget: ""
    service_page: ""
  - id: crm
    n: "06"
    title: Sales Funnels, CRM & Revenue Automation
    short: CRM & funnels
    problem: "Leads arrive by form, phone, email and WhatsApp — and some are never followed up."
    approach: "Design one pipeline, connect every lead source to it, and automate the follow-up: messages, reminders, bookings and tasks for the steps a person should take."
    deliverables: [CRM and pipeline design, Lead forms and funnels connected to the CRM, Email / SMS / WhatsApp follow-up sequences, Booking calendars, Pipeline reporting]
    value: Every enquiry captured and followed up on time, with a clear view of what is in the pipeline.
    tech: [GoHighLevel, A2P 10DLC SMS, WhatsApp Business, Webhooks, n8n]
    delivery: direct
    budget: ""
    service_page: services/crm-automation/
    proof: [{ label: "Eagle Premier Real Estate — five forms, one GoHighLevel pipeline", url: "portfolio/eagle/" }]
  - id: ai
    n: "07"
    title: AI Agents & Business Process Automation
    short: AI & automation
    problem: "Skilled people spending hours on copying data, sorting enquiries and writing the same replies."
    approach: "Map the process, decide where automation or AI genuinely helps, and build documented workflows with a person approving what matters."
    deliverables: [Process map and automation plan, n8n workflows with error handling, AI assistants and agent instructions, API integrations, Team prompt library and guidelines]
    value: Time back for the work that needs people, and processes that keep running when someone is away.
    tech: [n8n, OpenAI / Anthropic / Gemini APIs, REST APIs and webhooks, Google Workspace, Claude Code / Cursor]
    delivery: direct
    budget: ""
    service_page: services/ai-automation/
    proof: [{ label: "AI Prompt Engineering — free prompt library and packages", url: "ai-prompt-engineering/" }]
  - id: security
    n: "08"
    title: IT Infrastructure & Cybersecurity
    short: IT & security
    problem: "A growing business with no written IT set-up, shared passwords and a website nobody has security-reviewed."
    approach: "Harden the website and hosting, put the basics of accounts, devices, backups and access in place, and document who owns what."
    deliverables: [Website and WordPress hardening, Security assessment with prioritised fixes, "Accounts, email and access set-up", Backups that are tested, IT documentation]
    value: Lower risk of downtime and data loss, and a clear plan for what to fix first.
    tech: [WordPress hardening, Web application firewalls, SSL / TLS, Google Workspace / Microsoft 365, Backups]
    delivery: direct
    budget: ""
    service_page: services/cybersecurity/
    proof: [{ label: "Master's research on cyber resilience in Bangladesh's ISPs", url: "education/#research" }]
  - id: operations
    n: "09"
    title: Business Operations, ERP & Management Systems
    short: Operations & ERP
    problem: "Stock, orders, staff, attendance and expenses tracked across spreadsheets that disagree with each other."
    approach: "Choose or build the system that fits the business — an existing ERP, a configured platform, or a custom WordPress tool — and move the data and processes into it."
    deliverables: [Requirements and system selection, ERP / management system set-up, Custom internal tools, Data migration, Staff training]
    value: One reliable source of truth for operations, and less time reconciling spreadsheets.
    tech: [Odoo / ERPNext, Custom WordPress plugins, Google Sheets automation, n8n]
    delivery: scoped
    budget: ""
    service_page: ""
  - id: expansion
    n: "10"
    title: International Expansion & Business Growth
    short: Expansion
    problem: "A business ready to sell abroad, without the multilingual site, payments, compliance basics or local presence to do it."
    approach: "Plan the target markets, then put the digital groundwork in place: localised site and content, payments and currencies, international SEO and market-specific campaigns."
    deliverables: [Market-entry plan, Multilingual / multi-region website, International payments and shipping set-up, International SEO (hreflang), Market-specific campaigns]
    value: A credible presence in each new market without rebuilding the business for each one.
    tech: [WPML / Weglot, Shopify Markets, Stripe / PayPal, hreflang, Multi-currency]
    delivery: scoped
    budget: ""
    service_page: ""
    proof: [{ label: "ARCA Advisory — a site for a firm working across Europe and Asia-Pacific", url: "portfolio/arca/" }]
  - id: analytics
    n: "11"
    title: Analytics, Optimisation & Scaling
    short: Analytics
    problem: "Plenty of data in different tools, and no clear answer to which channel, page or product actually makes money."
    approach: "Define the few numbers that matter, connect the data sources, build a dashboard people will read, and run structured improvements on what it shows."
    deliverables: [Measurement plan and KPIs, Analytics and conversion tracking, Reporting dashboard, Conversion-rate improvement tests, Quarterly optimisation review]
    value: Decisions based on what the numbers show, and a clear view of where to invest next.
    tech: [Google Analytics 4, Looker Studio, Tag Manager, Microsoft Clarity, CRM reporting]
    delivery: scoped
    budget: ""
    service_page: ""
  - id: support
    n: "12"
    title: Ongoing Technical Support & Maintenance
    short: Support
    problem: "A website or system that was built well, then left without updates, backups or anyone responsible."
    approach: "A retainer that keeps everything updated, backed up, monitored and secure, with a set amount of time for changes each month."
    deliverables: [Updates and security patches, Backups and uptime monitoring, Monthly changes and fixes, Performance checks, Priority support channel]
    value: Systems that stay fast and secure, and one accountable contact when something needs changing.
    tech: [Managed WordPress, Uptime monitoring, Backups, Staging environments]
    delivery: scoped
    budget: ""
    service_page: ""

# The business lifecycle. `services` are category ids above.
stages:
  - id: idea
    n: "01"
    title: Idea
    line: Shape the idea into something you can test.
    services: [strategy]
    deliverables: [Business and customer brief, First list of what must exist to launch]
    process: [Discovery call, Written brief, Agreement on the first step]
  - id: validate
    n: "02"
    title: Validate
    line: Check that real customers want it before spending heavily.
    services: [strategy, web, marketing]
    deliverables: [Landing page with sign-up or pre-order, Small test campaign, What the test showed]
    process: [Define what would count as interest, Build a simple test, Read the results honestly]
  - id: establish
    n: "03"
    title: Establish
    line: Give the business an identity, accounts and the basic systems.
    services: [branding, security, operations]
    deliverables: [Identity system, Business email and accounts, Core tools and access set up]
    process: [Identity workshop, Set-up checklist, Hand-over of every login]
  - id: launch
    n: "04"
    title: Launch
    line: Open for business online.
    services: [web, seo, crm]
    deliverables: [Website or store live, Lead capture into the CRM, Search basics in place]
    process: [Page plan and design, Build on staging, Launch checklist and go-live]
  - id: market
    n: "05"
    title: Market
    line: Bring in customers through the right channels.
    services: [marketing, seo, crm]
    deliverables: [Channel plan, Running campaigns with tracking, Follow-up sequences]
    process: [Pick channels, Launch campaigns, Review weekly then monthly]
  - id: automate
    n: "06"
    title: Automate
    line: Take repetitive work off the team.
    services: [ai, crm, operations]
    deliverables: [Process map, Documented workflows, AI assistants with clear limits]
    process: [Map the process, Automate step by step, Document and train]
  - id: grow
    n: "07"
    title: Grow
    line: Improve what works and add what is missing.
    services: [analytics, marketing, support]
    deliverables: [Reporting dashboard, Optimisation tests, Retainer for steady improvement]
    process: [Measure, Test one change at a time, Keep what works]
  - id: scale
    n: "08"
    title: Scale
    line: New markets, larger teams, stronger systems.
    services: [expansion, operations, security]
    deliverables: [Market-entry plan, Systems that handle more volume, Security reviewed for a larger team]
    process: [Plan the next market, Strengthen systems, Review security and access]

