{%- comment -%}
  Shared header. Pass base="" on the home page and base="../" on pages one folder deep,
  plus current="about" (etc.) to mark the current page.
{%- endcomment -%}
<a class="skip-link" href="#main">Skip to content</a>

<header class="site-header" id="site-header">
  <div class="header-inner">
    <a class="wordmark" href="{% if include.base == '' %}#top{% else %}{{ include.base }}{% endif %}" aria-label="Dwaipyan Mandal — home">
      <span class="wordmark-name">Dwaipyan Mandal</span><span class="wordmark-dot" aria-hidden="true"></span>
    </a>

    <nav class="primary-nav" id="primary-nav" aria-label="Primary">
      <ul>
        <li><a href="{{ include.base }}#work">Work</a></li>
        <li><a href="{{ include.base }}#build">What I build</a></li>
        <li><a href="{{ include.base }}#leadership">Leadership</a></li>
        <li><a href="{{ include.base }}about/"{% if include.current == 'about' %} aria-current="page"{% endif %}>About</a></li>
        <li class="nav-cta-item"><a class="btn btn-ink btn-sm" href="{{ include.base }}#contact">Start a project</a></li>
      </ul>
    </nav>

    <button class="xray-toggle" id="xray-toggle" type="button" aria-pressed="false" title="X-ray mode — see how this page is built (shortcut: X)">
      <span class="xray-icon" aria-hidden="true"></span><span class="xray-label">X-ray</span>
    </button>

    <button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav">
      <span class="menu-toggle-label">Menu</span>
      <span class="menu-toggle-icon" aria-hidden="true"><i></i><i></i></span>
    </button>
  </div>
</header>
